name: Windows build and release
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record run identity
        shell: pwsh
        run: |
          $version = "0.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - name: Build genuine unsigned Squirrel installer
        shell: cmd
        run: build-installer.bat -Version %BUILD_VERSION%
      - name: Publish unique normal release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Checkout does not match the workflow source SHA.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Main lineage could not be fetched.' }
          git merge-base --is-ancestor origin/main $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release source is outside the current main lineage.' }
          $buildReceipt = Get-Content out/receipts/build.json -Raw | ConvertFrom-Json
          $packageReceipt = Get-Content out/receipts/package.json -Raw | ConvertFrom-Json
          if ($buildReceipt.source -ne $env:GITHUB_SHA -or $packageReceipt.source -ne $env:GITHUB_SHA) { throw 'Delivery receipts do not bind to the workflow source.' }
          $completed = [DateTime]::UtcNow
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $run.run_started_at) { throw 'Workflow start timestamp unavailable.' }
          $started = [DateTime]::Parse($run.run_started_at).ToUniversalTime()
          $duration = ($completed - $started).ToString('hh\:mm\:ss')
          $notes = @"
          Source: $env:GITHUB_SHA
          Version: $env:BUILD_VERSION
          Target: Windows x64, self-contained .NET 10.
          
          The genuine Squirrel.Windows installer is unsigned and may trigger an unknown-publisher or SmartScreen warning.
          This workflow builds and packages only. It runs no tests or lint; a published release does not imply those checks passed.
          No verified unused dim-sum catalogue entry was selected for this automated build, so this release uses its version alone.
          
          Workflow started: $($started.ToString('o'))
          Workflow completed: $($completed.ToString('o'))
          Workflow duration: $duration
          "@
          $notes | Set-Content out/release-notes.md
          gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "Material Docker Image $env:BUILD_VERSION" --notes-file out/release-notes.md out/releases/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = [DateTime]::UtcNow
          $finalDuration = ($published - $started).ToString('hh\:mm\:ss')
          $notes = $notes.Replace($completed.ToString('o'), $published.ToString('o')).Replace("Workflow duration: $duration", "Workflow duration: $finalDuration")
          $notes | Set-Content out/release-notes.md
          gh release edit $env:RELEASE_TAG --notes-file out/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,tagName,targetCommitish,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) { throw 'Normal release readback failed.' }
          if ($release.tagName -ne $env:RELEASE_TAG) { throw 'Release tag readback mismatch.' }
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Published tag ref readback failed.' }
          $object = $tag.object
          for ($depth = 0; $object.type -eq 'tag' -and $depth -lt 4; $depth++) {
            $annotated = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Annotated tag resolution failed.' }
            $object = $annotated.object
          }
          if ($object.type -ne 'commit' -or $object.sha -ne $env:GITHUB_SHA) { throw 'Published tag does not resolve to the exact workflow source SHA.' }
          foreach ($name in @('Setup.exe','RELEASES',"MaterialDockerImage-$env:BUILD_VERSION-full.nupkg",'build.json','package.json')) {
            if ($name -notin $release.assets.name) { throw "Release asset missing: $name" }
          }
          $release | ConvertTo-Json -Depth 8 | Set-Content out/receipts/release.json
      - name: Collect safe build evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/receipts | Out-Null
          @{runId=$env:GITHUB_RUN_ID; source=$env:GITHUB_SHA; jobStatus='${{ job.status }}'; runnerOS=$env:RUNNER_OS; runnerArch=$env:RUNNER_ARCH} | ConvertTo-Json | Set-Content out/receipts/workflow.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: windows-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/releases/*
            out/receipts/*
            out/logs/*
          if-no-files-found: warn
          retention-days: 14

