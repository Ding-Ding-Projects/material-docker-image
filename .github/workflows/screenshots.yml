name: Tests and screenshots
on:
  push:
    branches: ['**']
    paths: ['src/**', 'tests/**', 'build/**', 'docs/**', 'website/**', 'scripts/**', 'build.bat', 'global.json', '.github/workflows/screenshots.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run tests through the root build entrypoint
        shell: cmd
        run: build.bat -Tests
      - name: Publish the application
        shell: cmd
        run: build.bat -Version 0.0.${{ github.run_number }}
      - name: Make sure the Docker engine is running
        shell: pwsh
        run: |
          # The capture needs a real engine; without one every engine page shows its error state, which must never be
          # published as product evidence. Start the service when it is stopped and fail clearly when it never answers.
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($null -eq $service) { throw 'The Docker service is not installed on this runner, so the populated screens cannot be captured.' }
          if ($service.Status -ne 'Running') { Write-Host "Docker service is $($service.Status); starting it."; Start-Service docker }
          $deadline = (Get-Date).AddMinutes(2)
          do { docker info --format '{{.OSType}} {{.ServerVersion}}' 2>$null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep 5 } while ((Get-Date) -lt $deadline)
          throw 'The Docker engine did not answer within two minutes, so the populated screens cannot be captured.'
      - name: Create labelled engine resources for populated screens
        shell: pwsh
        continue-on-error: true
        run: |
          docker version
          docker info --format "{{.OSType}} {{.ServerVersion}}"
          $image = 'mcr.microsoft.com/windows/nanoserver:ltsc2025'
          docker image pull $image
          docker image tag $image screenshot-sample/hello-api:1.4.0
          docker volume create --label material-docker-image.capture=true screenshot-data
          docker network create --driver nat --label material-docker-image.capture=true screenshot-net
          docker container run --detach --name screenshot-web --label material-docker-image.capture=true --network screenshot-net screenshot-sample/hello-api:1.4.0 ping -t localhost
          docker container create --name screenshot-job --label material-docker-image.capture=true --mount type=volume,source=screenshot-data,target=C:\data screenshot-sample/hello-api:1.4.0 cmd /c echo done
          docker container logs screenshot-web
          docker container ls --all
      - name: Use a 1920x1080 desktop so windows are not limited by the runner screen
        shell: powershell
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
      - name: Capture every surface
        shell: pwsh
        run: |
          $exe = Resolve-Path out/publish/MaterialDockerImage.exe
          New-Item -ItemType Directory -Force out/captures | Out-Null
          $runs = @(
            @('--capture', 'out/captures'),
            @('--capture', 'out/captures', '--capture-theme', 'Light'),
            @('--capture', 'out/captures', '--capture-size', '960x720')
          )
          foreach ($run in $runs) {
            $p = Start-Process -FilePath $exe -ArgumentList ($run + @('--software-rendering')) -PassThru -Wait -RedirectStandardOutput out/captures/stdout.txt -RedirectStandardError out/captures/stderr.txt
            Get-Content out/captures/stdout.txt, out/captures/stderr.txt -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { throw "Capture run failed with exit code $($p.ExitCode): $run" }
          }
          Get-ChildItem out/captures -Filter *.png | Select-Object Name, Length
          if ((Get-ChildItem out/captures -Filter *.png).Count -lt 20) { throw 'Too few captures were written.' }
      - name: Remove labelled engine resources
        if: ${{ always() }}
        shell: pwsh
        continue-on-error: true
        run: |
          docker container rm --force screenshot-web screenshot-job
          docker network rm screenshot-net
          docker volume rm screenshot-data
          docker image rm screenshot-sample/hello-api:1.4.0
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshots-${{ github.sha }}
          path: |
            out/captures/
            out/logs/
          retention-days: 14
