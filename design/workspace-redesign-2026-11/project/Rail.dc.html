<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"MSO";src:url("/_blob/d9af12d36fa91b053ce96cda69b424eb") format("truetype");}
@font-face{font-family:"MSF";src:url("/_blob/7fc89dce2cd820b081369e0fff242eae") format("truetype");}
</style>
</helmet>
<nav aria-label="Destinations" style="width: 96px; height: 912px; box-sizing: border-box; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #111318; font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif">
<sc-for list="{{items}}" as="item" hint-placeholder-count="12">
<a href="#" aria-current="{{item.current}}" style="width: 80px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{item.ink}}">
<span aria-hidden="true" style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: {{item.font}}; font-size: 22px; background: {{item.pill}}; color: {{item.iconInk}}">{{item.icon}}</span>
<span style="font-size: 12px; line-height: 1.3; font-weight: {{item.weight}}">{{item.label}}</span>
</a>
</sc-for>
<div style="flex: 1 1 auto"></div>
<a href="#" style="width: 80px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{settings.ink}}">
<span aria-hidden="true" style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: {{settings.font}}; font-size: 22px; background: {{settings.pill}}; color: {{settings.iconInk}}">&#xE8B8;</span>
<span style="font-size: 12px; line-height: 1.3">Settings</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Build","Creator","Images","Containers","Compose","Canvas","Storage","Monitor","System","Registry","Diagnostics","Tools","Activity","Settings"],"default":"Build"},"$preview":{"width":96,"height":912}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'Build';
const raw = [['Build',''],['Creator',''],['Images',''],['Containers',''],['Compose',''],['Canvas',''],['Storage',''],['Monitor',''],['System',''],['Registry',''],['Diagnostics',''],['Tools',''],['Activity','']];
const style = (on) => ({ ink: on ? '#E2E2E9' : '#C4C6D0', pill: on ? '#3E4759' : 'transparent', iconInk: on ? '#DAE2F9' : '#C4C6D0', font: on ? 'MSF' : 'MSO', weight: on ? 600 : 400, current: on ? 'page' : 'false' });
return { items: raw.map(([label, icon]) => ({ label, icon, ...style(label === active) })), settings: style(active === 'Settings') };
}
}
</script>
</body>
</html>
