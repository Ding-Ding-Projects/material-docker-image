<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"MSO";src:url("/_blob/28fd57aaf616f10e48ec5a006964590d") format("truetype");}
@font-face{font-family:"MSF";src:url("/_blob/f56d5dedbdf2c9525a3831a178857862") format("truetype");}
</style>
</helmet>
<nav aria-label="Destinations" style="width: 96px; height: 912px; box-sizing: border-box; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 0; background: #111318; font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif">
<sc-for list="{{items}}" as="item" hint-placeholder-count="18">
<a href="#" aria-label="{{item.label}}" title="{{item.label}}" aria-current="{{item.current}}" style="width: 80px; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{item.ink}}">
<span aria-hidden="true" style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: {{item.font}}; font-size: 22px; background: {{item.pill}}; color: {{item.iconInk}}">{{item.icon}}</span>
</a>
</sc-for>
<div style="flex: 1 1 auto"></div>
<a href="#" aria-label="Settings" title="Settings" aria-current="{{settings.current}}" style="width: 80px; height: 48px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: {{settings.ink}}">
<span aria-hidden="true" style="width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: {{settings.font}}; font-size: 22px; background: {{settings.pill}}; color: {{settings.iconInk}}">&#xE8B8;</span>
</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Build","Creator","Images","Containers","Bake","Security","Compose","Canvas","Contexts","Swarm","Minecraft","Storage","Monitor","System","Registry","Diagnostics","Tools","Activity","Settings"],"default":"Build"},"$preview":{"width":96,"height":912}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'Build';
const raw = [['Build',''],['Creator',''],['Images',''],['Containers',''],['Bake',''],['Security',''],['Compose',''],['Canvas',''],['Contexts',''],['Swarm',''],['Minecraft',''],['Storage',''],['Monitor',''],['System',''],['Registry',''],['Diagnostics',''],['Tools',''],['Activity','']];
const style = (on) => ({ ink: on ? '#E2E2E9' : '#C4C6D0', pill: on ? '#3E4759' : 'transparent', iconInk: on ? '#DAE2F9' : '#C4C6D0', font: on ? 'MSF' : 'MSO', current: on ? 'page' : 'false' });
return { items: raw.map(([label, icon]) => ({ label, icon, ...style(label === active) })), settings: style(active === 'Settings') };
}
}
</script>
</body>
</html>
