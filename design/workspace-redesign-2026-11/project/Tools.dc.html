<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@font-face{font-family:"MSO";src:url("/_blob/28fd57aaf616f10e48ec5a006964590d") format("truetype");}
@font-face{font-family:"MSF";src:url("/_blob/f56d5dedbdf2c9525a3831a178857862") format("truetype");}
</style>
</helmet>
<div style="width: 1440px; height: 960px; display: flex; flex-direction: column; background: #111318; color: #E2E2E9; font-family: 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif; font-size: 14px; overflow: hidden; position: relative">
<dc-import name="TitleBar" hint-size="1440px,48px"></dc-import>
<div style="display: flex; flex: 1 1 auto; min-height: 0">
<dc-import name="Rail" active="Tools" hint-size="96px,912px"></dc-import>
<main style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 16px 0">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><span style="font-size: 22px; font-weight: 600; line-height: 1.3">Tools</span><span style="font-size: 13px; color: #C4C6D0">Everything here works offline</span></div>
</div>
<div role="tablist" aria-label="Tools" style="display: flex; gap: 4px; border-bottom: 1px solid #282A2F">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button role="tab" aria-selected="{{t.selected}}" style="height: 48px; padding: 0 18px; border: none; border-bottom: 3px solid {{t.bar}}; background: transparent; color: {{t.ink}}; font: inherit; font-weight: {{t.weight}}; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="font-family: MSO; font-size: 18px">{{t.icon}}</span>{{t.label}}</button>
</sc-for>
</div>
<div style="flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px">
<section role="tabpanel" aria-label="Base64" style="background: #191C20; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #C4C6D0; font-weight: 600">Direction</span>
<div role="radiogroup" aria-label="Direction" style="display: grid; grid-template-columns: auto auto; border: 1px solid #8E9099; border-radius: 20px; overflow: hidden; height: 40px">
<button role="radio" aria-checked="true" style="border: none; background: #3E4759; color: #DAE2F9; font: inherit; font-weight: 600; padding: 0 16px; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-family: MSO; font-size: 16px">&#xE668;</span>Encode</button>
<button role="radio" aria-checked="false" style="border: none; border-left: 1px solid #8E9099; background: transparent; color: #E2E2E9; font: inherit; padding: 0 16px">Decode</button>
</div></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #C4C6D0; font-weight: 600">Variant</span>
<div role="radiogroup" aria-label="Variant" style="display: grid; grid-template-columns: auto auto auto; border: 1px solid #8E9099; border-radius: 20px; overflow: hidden; height: 40px">
<button role="radio" aria-checked="true" style="border: none; background: #3E4759; color: #DAE2F9; font: inherit; font-weight: 600; padding: 0 16px; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-family: MSO; font-size: 16px">&#xE668;</span>Standard</button>
<button role="radio" aria-checked="false" style="border: none; border-left: 1px solid #8E9099; background: transparent; color: #E2E2E9; font: inherit; padding: 0 16px">URL-safe</button>
<button role="radio" aria-checked="false" style="border: none; border-left: 1px solid #8E9099; background: transparent; color: #E2E2E9; font: inherit; padding: 0 16px">MIME</button>
</div></div>
<div style="flex: 1 1 auto"></div>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: none; background: transparent; color: #ADC6FF; font: inherit; font-weight: 600; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-family: MSO; font-size: 18px">&#xE8D4;</span>Swap input and output</button>
</div>
<div style="flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px; min-height: 0">
<div style="display: flex; align-items: center; gap: 8px"><label for="b64in" style="font-size: 12px; color: #C4C6D0; font-weight: 600; flex: 1 1 auto">Input · UTF-8 text</label><span style="font-size: 12px; color: #C4C6D0">142 bytes</span><button style="height: 32px; padding: 0 10px; border: none; border-radius: 16px; background: transparent; color: #ADC6FF; font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px"><span aria-hidden="true" style="font-family: MSO; font-size: 16px">&#xE2C8;</span>Open file</button></div>
<textarea id="b64in" style="flex: 1 1 auto; resize: none; border-radius: 12px; border: 1px solid #8E9099; background: #111318; color: #E2E2E9; padding: 12px 14px; font: 13px/1.6 'Cascadia Mono',Consolas,monospace">{
  "auths": {
    "registry.internal.example:5000": {
      "auth": "c3dpZnRpZS1kZXY6KioqKg=="
    }
  },
  "credsStore": "desktop"
}</textarea>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-height: 0">
<div style="display: flex; align-items: center; gap: 8px"><label for="b64out" style="font-size: 12px; color: #C4C6D0; font-weight: 600; flex: 1 1 auto">Output · Base64, standard alphabet, padded</label><span style="font-size: 12px; color: #C4C6D0">192 bytes</span></div>
<textarea id="b64out" readonly style="flex: 1 1 auto; resize: none; border-radius: 12px; border: 1px solid #44474F; background: #1D2024; color: #E2E2E9; padding: 12px 14px; font: 13px/1.6 'Cascadia Mono',Consolas,monospace; word-break: break-all">ewogICJhdXRocyI6IHsKICAgICJyZWdpc3RyeS5pbnRlcm5hbC5leGFtcGxlOjUwMDAiOiB7CiAgICAgICJhdXRoIjogImMzZHBablJwWlMxa1pYWTZLaW9xS2c9PSIKICAgIH0KICB9LAogICJjcmVkc1N0b3JlIjogImRlc2t0b3AiCn0=</textarea>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex: 1 1 auto; font-size: 12px; color: #C4C6D0">Converted locally as you type. Input is not saved in Activity history.</span>
<button style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #8E9099; background: transparent; color: #ADC6FF; font: inherit; font-weight: 600; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-family: MSO; font-size: 18px">&#xE161;</span>Save as file</button>
<button style="height: 40px; padding: 0 20px; border-radius: 20px; border: none; background: #ADC6FF; color: #002E69; font: inherit; font-weight: 600; display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="font-family: MSO; font-size: 18px">&#xE14D;</span>Copy</button>
</div>
</section>
<aside aria-label="Offline documentation" style="background: #191C20; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="font-family: MSO; font-size: 20px; color: #ADC6FF">&#xEA19;</span><span style="font-size: 16px; font-weight: 600; flex: 1 1 auto">Documentation</span><span style="font-size: 12px; color: #C4C6D0">Offline · 42 articles</span></div>
<div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 20px; background: #282A2F"><span aria-hidden="true" style="font-family: MSO; font-size: 18px; color: #C4C6D0">&#xEF7A;</span><input aria-label="Search documentation" value="port" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: #E2E2E9; font: inherit; outline: none"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="7">
<a href="#" style="min-height: 56px; border-radius: 12px; padding: 8px 10px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #E2E2E9; background: {{d.bg}}">
<span aria-hidden="true" style="font-family: MSO; font-size: 18px; color: #C4C6D0">&#xE873;</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0"><span style="font-weight: 600">{{d.title}}</span><span style="font-size: 12px; color: #C4C6D0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.sub}}</span></span>
<span aria-hidden="true" style="font-family: MSO; font-size: 18px; color: #8E9099">&#xE5CC;</span>
</a>
</sc-for>
</div>
</aside>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const tabs = [['Base64',''],['Documentation',''],['Activity history',''],['Changelog','']].map(([label,icon]) => { const on = label === 'Base64'; return { label, icon, selected: on ? 'true' : 'false', bar: on ? '#ADC6FF' : 'transparent', ink: on ? '#ADC6FF' : '#C4C6D0', weight: on ? 600 : 400 }; });
const docs = [
 ['Publishing ports safely','Bind address, 127.0.0.1 versus all interfaces',true],
 ['Port conflicts on Windows','Finding which process holds a port',false],
 ['EXPOSE versus publish','What the Dockerfile documents and what run does',false],
 ['Compose port syntax','Short and long forms, ranges, protocols',false],
 ['Networks and service names','How containers reach each other',false],
 ['Firewall prompts','Why Windows asks and what to allow',false],
 ['Health checks','Make readiness visible to the engine',false]
].map(([title,sub,sel]) => ({ title, sub, bg: sel ? '#282A2F' : 'transparent' }));
return { tabs, docs };
}
}
</script>
</body>
</html>
